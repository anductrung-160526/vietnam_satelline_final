name: Prepare province runner
description: Install tools and materialize authorized configuration without logging secrets
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - shell: bash
      run: python -m pip install -r province_pipeline/requirements.txt
    - shell: bash
      run: |
        python - <<'PY'
        import json, os
        from pathlib import Path
        out = Path('.province-local')
        out.mkdir(exist_ok=True)
        config = json.loads(os.environ['PROVINCE_CONFIG_JSON'])
        (out/'config.json').write_text(json.dumps(config), encoding='utf-8')
        credential = Path(os.environ['RUNNER_TEMP'])/'province-credentials.json'
        data = json.loads(os.environ['PROVINCE_GOOGLE_CREDENTIALS_JSON'])
        credential.write_text(json.dumps(data), encoding='utf-8')
        credential.chmod(0o600)
        with open(os.environ['GITHUB_ENV'], 'a') as stream:
            stream.write('PROVINCE_GOOGLE_CREDENTIALS='+str(credential)+'\n')
        PY
    - shell: bash
      run: python -m province_pipeline --config .province-local/config.json sync-boundaries
