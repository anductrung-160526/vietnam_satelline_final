name: Province satellite staging
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check credentials and sources, or run admitted transfers
        type: choice
        default: check_only
        options: [check_only, organize_only, run]
  schedule:
    - cron: '17,47 * * * *'

# Serializes controllers AND the matrix workers across all invocations.
# Queued schedules may be coalesced by GitHub; durable Drive state handles resumption.
concurrency:
  group: province-satellite-staging
  cancel-in-progress: false
permissions:
  contents: read

env:
  # Branch-only pilot config; main deliberately ignores this variable.
  PROVINCE_CONFIG_JSON: ${{ github.ref_name == 'inspriring-newton' && vars.PROVINCE_BRANCH_CONFIG_JSON || vars.PROVINCE_CONFIG_JSON }}
  EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
  RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
  PROVINCE_RCLONE_REMOTE: ${{ vars.PROVINCE_RCLONE_REMOTE }}

jobs:
  controller:
    if: ${{ (github.ref_name == 'inspriring-newton' && vars.PROVINCE_BRANCH_CONFIG_JSON != '') || vars.PROVINCE_CONFIG_JSON != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/province-setup
      - name: Read-only credential preflight
        run: python -m province_pipeline --config .province-local/config.json preflight
      - name: Read-only source inventory
        if: ${{ inputs.mode == 'check_only' }}
        run: python -m province_pipeline --config .province-local/config.json inventory
      - name: Organize existing verified outputs into canonical packages
        if: ${{ inputs.mode == 'organize_only' }}
        run: python -m province_pipeline --config .province-local/config.json organize-drive
      - name: Reconcile and reserve global export capacity
        if: ${{ inputs.mode != 'check_only' && inputs.mode != 'organize_only' }}
        id: plan
        run: |
          python -m province_pipeline --config .province-local/config.json plan --output .province-local/plan.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads(Path('.province-local/plan.json').read_text())
          groups = sorted({j['province']['group_id'] for j in plan['jobs']})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('groups='+json.dumps(groups)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.mode != 'check_only' && inputs.mode != 'organize_only' }}
        with:
          name: province-plan
          path: .province-local/plan.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.mode == 'check_only' }}
        with:
          name: province-source-inventory
          path: .province-local/source_inventory.csv
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Remove credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/province-auth"

  export:
    if: ${{ needs.controller.outputs.groups != '[]' && needs.controller.outputs.groups != '' }}
    needs: controller
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        group: ${{ fromJSON(needs.controller.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/province-setup
      - uses: actions/download-artifact@v4
        with:
          name: province-plan
          path: .province-local
      - name: Submit only assigned reservations
        run: python -m province_pipeline --config .province-local/config.json work --plan .province-local/plan.json --group '${{ matrix.group }}'
      - name: Remove credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/province-auth"
