name: VNGISDash huyện 07/2024–06/2025

# Mỗi lượt chạy tối đa 5 giờ 15 phút.
# Nếu chưa hoàn tất, workflow tự gọi lượt tiếp theo.
# Trạng thái được lưu trên Google Drive.
#
# day_scale=50 (mặc định): thư mục Districts_50m / Districts_50m_PILOT.
# day_scale=20: thư mục Districts / Districts_PILOT cũ.
#
# Dừng có trật tự:
# - Tạo file STOP ở thư mục gốc repository; hoặc
# - Tạo file _control/STOP trong thư mục kết quả trên Drive.
#
# Sau khi cập nhật mã, dùng Run workflow để chạy lượt mới.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "pilot = thí điểm | full = toàn bộ huyện"
        type: choice
        options:
          - pilot
          - full
        default: pilot

      pilot_n:
        description: "Số huyện thí điểm, chỉ dùng khi mode = pilot"
        required: false
        default: "2"

      workers:
        description: "Số huyện xử lý song song"
        required: false
        default: "4"

      day_scale:
        description: "TIFF ngày: 50 m chạy nhanh; 20 m giữ chi tiết cao. CSV giữ phép tính gốc."
        type: choice
        options:
          - "50"
          - "20"
        default: "50"

      stop_after_province:
        description: "Ô tương thích main; nhánh huyện luôn chạy toàn quốc, bỏ qua giá trị này"
        required: false
        type: string
        default: ""

concurrency:
  group: vngis-districts-202407-202506-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

env:
  VNGIS_MODE: ${{ inputs.mode }}
  VNGIS_PILOT_N: ${{ inputs.pilot_n }}
  VNGIS_DAY_IMAGE_SCALE: ${{ inputs.day_scale || '50' }}
  VNGIS_DRIVE_FOLDER: ${{ (inputs.day_scale || '50') == '50' && (inputs.mode == 'full' && 'VNGISDash_202407_202506_Districts_50m' || 'VNGISDash_202407_202506_Districts_50m_PILOT') || (inputs.mode == 'full' && 'VNGISDash_202407_202506_Districts' || 'VNGISDash_202407_202506_Districts_PILOT') }}
  VNGIS_RCLONE_REMOTE: gdrive
  VNGIS_START_MONTH: "2024-07"
  VNGIS_END_MONTH: "2025-06"

jobs:
  gate:
    name: Kiểm tra file STOP
    runs-on: ubuntu-latest

    outputs:
      stop: ${{ steps.chk.outputs.stop }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Kiểm tra STOP
        id: chk
        run: |
          if [ -f STOP ]; then
            echo "stop=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Có file STOP ở repo: không chạy lượt này."
          else
            echo "stop=false" >> "$GITHUB_OUTPUT"
          fi

  run:
    name: Chạy một lượt
    needs: gate
    if: needs.gate.outputs.stop != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      VNGIS_UPLOAD_EVERY_SEC: "300"
      VNGIS_MAX_RUNTIME_SEC: "18900"

      # Project được truyền vào ee.Initialize(project=...).
      VNGIS_EE_PROJECT: ${{ vars.VNGIS_DISTRICTS_EE_PROJECT || 'vngis-ee-2' }}
      VNGIS_EE_ASSET: ${{ vars.VNGIS_DISTRICTS_EE_ASSET }}
      VNGIS_EE_HIGH_VOLUME: "false"

      # Giới hạn chung cho truy vấn, tạo URL và tải ảnh.
      # Thử tối đa 4; tự giảm khi có 429. Variable cấu hình trước vẫn được ưu tiên.
      VNGIS_EE_CONCURRENCY: ${{ vars.VNGIS_DISTRICTS_EE_CONCURRENCY || '4' }}
      VNGIS_MONTH_THREADS: "2"
      VNGIS_EE_MAX_RETRIES: "8"

      # Định dạng ảnh ngày.
      VNGIS_DAY_FORMAT: "int16"
      VNGIS_DAY_BANDS: "10"
      VNGIS_DAY_SCALE: "10000"
      VNGIS_TIFF_ZLEVEL: "6"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.11"

      - name: Cache thư viện Python và rclone
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            ~/venv
            ~/bin/rclone
          key: deps-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt') }}-rclone1

      - name: Cài thư viện và rclone
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          python -m venv "$HOME/venv"
          "$HOME/venv/bin/pip" install -q -r requirements.txt

          mkdir -p "$HOME/bin"
          cd /tmp

          curl -fsSL \
            -o rclone.zip \
            https://downloads.rclone.org/rclone-current-linux-amd64.zip

          unzip -q rclone.zip
          cp rclone-*-linux-amd64/rclone "$HOME/bin/rclone"
          chmod +x "$HOME/bin/rclone"

      - name: Đưa venv và rclone vào PATH
        run: |
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Cache ranh giới GADM
        uses: actions/cache@v4
        with:
          path: ~/vngis_2024/_cache
          key: gadm41-vnm-level2-v1

      - name: Ghi khóa truy cập từ Secrets
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONF }}
          EE_KEY_DATA: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
        run: |
          [ -n "$RCLONE_CONF_DATA" ] || {
            echo "::error::Thiếu secret RCLONE_CONF"
            exit 1
          }

          [ -n "$EE_KEY_DATA" ] || {
            echo "::error::Thiếu secret EE_SERVICE_ACCOUNT_JSON"
            exit 1
          }

          mkdir -p "$HOME/.config/rclone"

          printf '%s' "$RCLONE_CONF_DATA" \
            > "$HOME/.config/rclone/rclone.conf"

          printf '%s' "$EE_KEY_DATA" \
            > "$RUNNER_TEMP/ee-key.json"

          chmod 600 \
            "$HOME/.config/rclone/rclone.conf" \
            "$RUNNER_TEMP/ee-key.json"

          echo "Project Earth Engine: $VNGIS_EE_PROJECT"
          echo "Thư mục đích trên Drive: $VNGIS_DRIVE_FOLDER"
          echo "Giới hạn đồng thời EE: $VNGIS_EE_CONCURRENCY"

      - name: Chạy pipeline
        id: pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          VNGIS_EE_KEY_FILE: ${{ runner.temp }}/ee-key.json
          VNGIS_RUN_ID: ${{ github.run_id }}
          VNGIS_WORKERS: ${{ inputs.workers }}
          STOP_POLL_SEC: "300"
        run: |
          set +e

          python -u vngis_2024.py &
          PID=$!

          (
            while kill -0 "$PID" 2>/dev/null; do
              for _ in $(seq 1 "$STOP_POLL_SEC"); do
                sleep 1
                kill -0 "$PID" 2>/dev/null || exit 0
              done

              if gh api \
                "repos/${GITHUB_REPOSITORY}/contents/STOP?ref=${GITHUB_REF_NAME}" \
                > /dev/null 2>&1; then

                echo "::notice::Phát hiện file STOP: dừng trật tự."
                kill -TERM "$PID" 2>/dev/null
                exit 0
              fi
            done
          ) &

          WATCH=$!

          wait "$PID"
          code=$?

          kill "$WATCH" 2>/dev/null
          wait "$WATCH" 2>/dev/null

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Script thoát với mã $code"

          exit 0

      - name: Đồng bộ nốt lên Drive
        if: always()
        continue-on-error: true
        run: python vngis_2024.py --sync-only

      - name: Kiểm tra kết quả thí điểm
        if: always() && inputs.mode == 'pilot' && steps.pipeline.outputs.code == '0'
        run: |
          python verify_pilot.py \
            --remote "${VNGIS_RCLONE_REMOTE}:${VNGIS_DRIVE_FOLDER}" \
            --report "$RUNNER_TEMP/verify_report.md"

          cat "$RUNNER_TEMP/verify_report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Tóm tắt tiến độ
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import pandas as pd

          folder = os.environ["VNGIS_DRIVE_FOLDER"]

          p = os.path.expanduser(
              f"~/vngis_2024/{folder}/_control/progress.csv"
          )

          if os.path.isfile(p):
              d = pd.read_csv(p)

              print(f"### Tiến độ ({folder})\n")
              print(
                  f"Tổng {len(d):,} huyện: "
                  f"{d['status'].value_counts().to_dict()}\n"
              )

              bad = d[d["status"] != "done"].head(15)

              if len(bad):
                  print(
                  "| GID_2 | trạng thái | lỗi |\n"
                      "|---|---|---|"
                  )

                  for r in bad.itertuples():
                      error = str(r.errors)[:150]
                      print(
                      f"| {r.GID_2} | {r.status} | {error} |"
                      )
          PY

      - name: Nối lượt kế tiếp
        if: steps.pipeline.outputs.code == '3' || steps.pipeline.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE_INPUT: ${{ inputs.mode }}
          PILOT_N_INPUT: ${{ inputs.pilot_n }}
          WORKERS_INPUT: ${{ inputs.workers }}
          DAY_SCALE_INPUT: ${{ inputs.day_scale || '50' }}
        run: |
          if gh api \
            "repos/${GITHUB_REPOSITORY}/contents/STOP?ref=${GITHUB_REF_NAME}" \
            > /dev/null 2>&1; then

            echo "::notice::Có file STOP: dừng chuỗi, không nối lượt."
          else
            gh workflow run vngis-2024.yml \
              --ref "$GITHUB_REF_NAME" \
              -f mode="$MODE_INPUT" \
              -f pilot_n="$PILOT_N_INPUT" \
              -f workers="$WORKERS_INPUT" \
              -f day_scale="$DAY_SCALE_INPUT"

            echo "Đã gọi lượt kế tiếp."
          fi

      - name: Báo lỗi nếu script thoát bất thường
        if: >-
          always() && steps.pipeline.outputs.code != '' &&
          steps.pipeline.outputs.code != '0' &&
          steps.pipeline.outputs.code != '2' &&
          steps.pipeline.outputs.code != '3' &&
          steps.pipeline.outputs.code != '130'
        run: |
          echo "::error::Script thoát với mã ${{ steps.pipeline.outputs.code }}. Mở bước 'Chạy pipeline', tìm các dòng [preflight] hoặc ERROR."
          exit 1
