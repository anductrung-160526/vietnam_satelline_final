name: Task 1-2-3 · 6 nhóm tỉnh cố định
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'pilot = tỉnh đầu nhóm, full = toàn nhóm; 2004-2025'
        type: choice
        options: [pilot, full, boundary_check]
        default: pilot
      province:
        description: 'Chỉ dùng cho boundary_check: mã tỉnh 2 ký tự (01 = Hà Nội)'
        default: '01'
      period:
        description: 'Chỉ dùng cho boundary_check: tháng YYYY-MM'
        default: '2025-01'
concurrency:
  group: task123-${{ github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  run:
    if: inputs.mode != 'boundary_check'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TASK_MODE: ${{ inputs.mode || 'pilot' }}
      TASK_EE_PROJECT: vgis-ee-6                                        # ĐỔI (thêm mới)
      PROVINCE_CONFIG_JSON: ${{ vars.PROVINCE_CONFIG_JSON_6 }}          # ĐỔI
      EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON_6 }} # ĐỔI
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      PROVINCE_RCLONE_REMOTE: gdrive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            province_pipeline/requirements.txt
      - name: Install dependencies and signed rclone
        run: |
          python -m pip install -r province_pipeline/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y rclone
      - name: Prepare fixed scope and existing credentials
        run: python -m task_pipeline.setup
      - name: Prepare pinned province boundaries
        run: python -m province_pipeline --config .province-local/config.json sync-boundaries
      - name: Run continuously within this runner
        id: pipeline
        shell: bash
        run: |
          if [ -f STOP ]; then
            echo 'code=130' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python -u -m task_pipeline.runner --max-seconds 18900
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != 0 ] && [ "$code" != 3 ] && [ "$code" != 4 ] && [ "$code" != 130 ]; then
            exit "$code"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task123-${{ github.ref_name }}-${{ inputs.mode }}
          path: |
            .province-local/panels/
            .province-local/previews/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Continue only when the runner time budget is reached
        if: steps.pipeline.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_MODE: ${{ inputs.mode }}
        run: gh workflow run vngis-2024.yml --ref "$GITHUB_REF_NAME" -f mode="$NEXT_MODE"
      - name: Capacity notice
        if: steps.pipeline.outputs.code == '4'
        run: echo '::notice::Staging share is full. Receive verified data to E, then run this branch again.'
      - name: Clean credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/province-auth"
  boundary_check:
    # Thử 1 tỉnh / 1 tháng ảnh ngày đã cắt theo ranh giới. Chỉ ghi artifact, không đụng Drive/state/CSV.
    if: inputs.mode == 'boundary_check'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      TASK_MODE: pilot
      TASK_EE_PROJECT: vgis-ee-6
      PROVINCE_CONFIG_JSON: ${{ vars.PROVINCE_CONFIG_JSON_6 }}
      EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON_6 }}
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      PROVINCE_RCLONE_REMOTE: gdrive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            province_pipeline/requirements.txt
      - run: python -m pip install -r province_pipeline/requirements.txt
      - name: Prepare config and credentials
        run: python -m task_pipeline.setup
      - name: Prepare pinned province boundaries
        run: python -m province_pipeline --config .province-local/config.json sync-boundaries
      - name: Build one masked day TIFF
        run: python -u -m task_pipeline.boundary_check --province "${{ inputs.province }}" --period "${{ inputs.period }}" --out boundary_check
      - name: Publish previews to branch boundary-check-results
        if: always()
        shell: bash
        run: |
          [ -f boundary_check/report.json ] || exit 0
          python - <<'PY'
          import json
          r=json.load(open('boundary_check/report.json',encoding='utf-8'))
          for k in ('province','period','inventory','grid','before_mask','mask','after_mask','tiff'):
              print(f"::notice title={k}::{json.dumps(r.get(k),ensure_ascii=False)}")
          PY
          mkdir -p /tmp/pub && cp boundary_check/*.png boundary_check/report.json /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub && git init -q && git checkout -q -b boundary-check-results
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -q -m "Boundary check ${{ inputs.province }} ${{ inputs.period }} (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" boundary-check-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boundary-check-preview
          path: |
            boundary_check/*.png
            boundary_check/report.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: boundary-check-tiff
          path: boundary_check/*.tif
          retention-days: 3
      - name: Clean credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/province-auth"
