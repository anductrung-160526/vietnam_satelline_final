name: Task 1-2-3 · 6 nhóm tỉnh cố định
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'pilot = tỉnh đầu nhóm, full = toàn nhóm; 2004-2025'
        type: choice
        options: [pilot, full]
        default: pilot
concurrency:
  group: task123-${{ github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TASK_MODE: ${{ inputs.mode || 'pilot' }}
      TASK_EE_PROJECT: vgis-ee-6                                        # ĐỔI (thêm mới)
      PROVINCE_CONFIG_JSON: ${{ vars.PROVINCE_CONFIG_JSON_6 }}          # ĐỔI
      EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON_6 }} # ĐỔI
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      PROVINCE_RCLONE_REMOTE: gdrive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            province_pipeline/requirements.txt
      - name: Install dependencies and signed rclone
        run: |
          python -m pip install -r province_pipeline/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y rclone
      - name: Prepare fixed scope and existing credentials
        run: python -m task_pipeline.setup
      - name: Prepare pinned province boundaries
        run: python -m province_pipeline --config .province-local/config.json sync-boundaries
      - name: Run continuously within this runner
        id: pipeline
        shell: bash
        run: |
          if [ -f STOP ]; then
            echo 'code=130' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python -u -m task_pipeline.runner --max-seconds 18900
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != 0 ] && [ "$code" != 3 ] && [ "$code" != 4 ] && [ "$code" != 130 ]; then
            exit "$code"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task123-${{ github.ref_name }}-${{ inputs.mode }}
          path: |
            .province-local/panels/
            .province-local/previews/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Continue only when the runner time budget is reached
        if: steps.pipeline.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_MODE: ${{ inputs.mode }}
        run: gh workflow run vngis-2024.yml --ref "$GITHUB_REF_NAME" -f mode="$NEXT_MODE"
      - name: Capacity notice
        if: steps.pipeline.outputs.code == '4'
        run: echo '::notice::Staging share is full. Receive verified data to E, then run this branch again.'
      - name: Clean credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/province-auth"
