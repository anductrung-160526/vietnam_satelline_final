name: Province pipeline tests
on:
  push:
    paths: ['task_pipeline/**', 'notebooks/task123/**', 'province_pipeline/**', 'tests/**', 'scripts/windows/**', '.github/workflows/province-*.yml', '.github/actions/province-setup/**']
  pull_request:
    paths: ['task_pipeline/**', 'notebooks/task123/**', 'province_pipeline/**', 'tests/**', 'scripts/windows/**', '.github/workflows/province-*.yml', '.github/actions/province-setup/**']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r province_pipeline/requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
        env:
          VNGIS_LOCAL_ROOT: ${{ runner.temp }}/legacy
          VNGIS_CACHE_DIR: ${{ runner.temp }}/cache
